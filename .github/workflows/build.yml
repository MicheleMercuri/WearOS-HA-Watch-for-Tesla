name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # No local.properties in CI: this checks that the generic configuration compiles,
      # both the debug build and the minified release build the README tells you to use
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon
